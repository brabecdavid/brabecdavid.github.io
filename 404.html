<!doctype html>
<html lang="cs"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stránka nenalezena – Studio PS</title>
<link rel="icon" href="/img/clona-64.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0a;color:#f2eee6;font:400 17px/1.6 Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.stripe{height:16px;background:repeating-linear-gradient(-60deg,#111 0 22px,#e0b13c 22px 44px)}
header{padding:26px 48px}header img{height:28px;width:auto}
main{flex:1;display:grid;place-items:center;padding:40px 16px;text-align:center}
.mono{font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#e0b13c}
h1{font:800 clamp(40px,7vw,96px)/.98 Poppins;letter-spacing:-.045em;margin:16px 0 18px}
h1 em{font-style:normal;color:#e0b13c}
p{color:#c2bbaa;max-width:40ch;margin:0 auto 32px}
.btn{display:inline-block;background:#e0b13c;color:#111;padding:15px 22px;font-weight:600}
@media(max-width:760px){header{padding:18px 16px}}
</style></head><body>
<header><a href="/"><img src="/img/logo-bila.png" alt="Studio PS"></a></header>
<main><div><span class="mono">● Chyba 404 · Záběr chybí</span><h1>Tenhle záběr <em>ve střihu není.</em></h1><p>Stránka, kterou hledáte, neexistuje nebo se přesunula. Zkuste to od začátku.</p><a class="btn" href="/">Na úvodní stránku</a></div></main>
<div class="stripe"></div>
</body></html>
